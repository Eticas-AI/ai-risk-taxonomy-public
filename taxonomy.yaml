- id: sentiment-fairness
  type: subcategory
  broader: bias-representational-harm
  maturity: emerging
  label: Sentiment and quality disparity across groups
  definition: The system produces outputs of systematically different tone, sentiment, or quality when
    describing or addressing different demographic groups — for example, more negative, more dismissive,
    or less detailed responses for certain populations.
  scope: LLM
  lifecycle_stages:
  - post-processing
  source: HRA
  alt_labels:
  - Sentiment fairness across groups
  mappings:

- id: privacy-confidentiality
  type: category
  label: Privacy & Confidentiality
  alt_labels:
  - Privacy
  - Data Privacy
  definition: 'The risk that an AI system collects, processes, or infers personal information in ways
    that infringe on individuals'' rights to control their data (privacy), or that sensitive information
    is exposed, accessed, or shared without authorization (confidentiality). This includes risks from
    data leakage, re-identification, unauthorized use, or insufficient safeguards. On the confidentiality
    side the category covers confidential information the system holds or is given - in particular customer,
    partner or third-party data entrusted under contract, NDA or similar terms of use; confidentiality
    as a general security property of the system (authentication, credential handling, endpoint hardening)
    is not a privacy risk and is not covered here.

    '
  scope: ALL
  lifecycle_stages:
  - pre-processing

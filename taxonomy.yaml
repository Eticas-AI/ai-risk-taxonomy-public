- id: measurement-validity
  type: subgroup
  broader: reliability
  maturity: emerging
  label: Measurement validity
  definition: For systems that produce evaluative judgements or scores, the risk that the output does
    not validly measure the criterion, construct, or outcome it purports to assess. Distinct from hallucination
    (factual fabrication) and output-inconsistency (same-input variability) — a single output may be stable,
    internally consistent, and factually accurate yet still fail to measure what it claims. Especially
    salient for assessment, scoring, grading, and ranking systems, where the output IS a measurement.
    Follows the standard validity framework — content, criterion, construct, external, consequential validity
    (Lissitz & Samuelsen, 2007); subcategories below operationalise specific validity types as audit-tractable
    risks.
  source: Eticas (Wiselook engagement, 2026-06; restructured Usman Gohar, July 2026)
- id: construct-validity
  type: subcategory
  broader: measurement-validity
  maturity: emerging
  label: Construct validity of evaluative outputs
  definition: The risk that an evaluation does not truly measure the construct it purports to measure
    — that it fails to capture all and only the components the construct requires. Manifests as failure
    to register construct-relevant evidence present in the input (under-sensitivity), or as the score
    moving on signals relevant only to a different construct (contamination).
  scope: ALL
  lifecycle_stages:
  - in-processing
  - post-processing
  source: Eticas (Wiselook engagement, 2026-06)

# Eticas AI Risk Taxonomy — public source (generated from the private
# repository; do not edit here).
#
# Each concept's `mappings` list is computed from the mapping records:
#   framework      key of the framework in mappings.yaml
#   target_id      the part mapped to, as the framework's file names it
#   target_uri     the part's IRI: the publisher's own where it mints one (ELI for
#                  EU legislation, DPV), otherwise the framework's base_uri + target_id
#   target_label   the label Eticas uses for the part; usually, not always, the
#                  framework's own heading (see CHANGELOG 5.6.0)
#   target_url     the part's page in English, where the framework publishes one
#   relation       exactMatch | closeMatch | broadMatch | narrowMatch | relatedMatch,
#                  read from the concept towards the part
#   review_status  reviewed (confirmed by an Eticas reviewer against the concept's
#                  current definition and this framework edition) | outdated
#                  (reviewed, but the definition has changed since) | inherited (in
#                  the taxonomy since before v5.7.0, unchanged, no review recorded) |
#                  agent-proposed (from an agent-based review that read both texts;
#                  no person has confirmed it yet) | provisional (made without access
#                  to the framework's text) | unreviewed (any other mapping with no
#                  review)
# Mappings whose review changed or rejected them are not published.

concepts:
- id: bias-fairness
  type: category
  label: Bias & Fairness
  alt_labels:
  - Fairness
  - Bias & Discrimination
  - Algorithmic fairness
  definition: 'The risk that an AI system produces outcomes that systematically advantage or disadvantage
    individuals or groups based on protected or sensitive attributes, leading to unequal treatment, reduced
    accuracy, or unjust impacts. This includes biases introduced through data, model design, or deployment
    context, and covers both measurable disparities and perceived unfairness in decision-making.

    '

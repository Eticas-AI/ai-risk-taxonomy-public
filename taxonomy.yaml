- id: confidential-data-use-violation
  type: subcategory
  broader: privacy-collection-use
  maturity: emerging
  label: Use of confidential data outside its sharing terms
  definition: 'Use, onward transfer or processing of confidential data entrusted to the system - customer,
    partner or third-party data shared under contract, NDA or other terms of use - for a purpose, by a
    recipient or in a jurisdiction those terms exclude. The contractual counterpart of unlawful-data-processing:
    the obligation arises from the terms under which the data was shared rather than from data protection
    law, and applies whether or not the data is personal.

    '
  scope: ALL
  lifecycle_stages:
  - pre-processing
  - in-processing
  - post-processing

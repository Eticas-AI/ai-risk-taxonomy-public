  broader: bias-representational-harm
  maturity: emerging
  label: Homogenization of output across groups
  definition: The system produces outputs that flatten cultural, linguistic, or stylistic diversity, defaulting
    to dominant patterns and erasing distinctive characteristics of underrepresented groups. Particularly
    relevant for generative AI, where homogenization in text, image, or speech outputs can reinforce hegemonic
    norms.
  scope: LLM
  lifecycle_stages:
  - post-processing

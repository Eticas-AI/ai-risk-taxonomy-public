    target_id: output-fairness-sentiment
    target_label: Output → Fairness (sentiment quality across groups)
    relation: narrowMatch
- id: performance-equity
  type: subcategory
  broader: bias-outcome-disparities
  maturity: emerging
  label: Differential performance across populations
  alt_labels:
  - Group-wise error rate
  - Performance equity across populations
  definition: The AI system performs systematically worse for some demographic groups than others — through
    higher error rates, lower accuracy, or reduced reliability — leading to unequal quality of service
    even when access is the same.
  scope: ALL
  lifecycle_stages:
  - in-processing
  - post-processing
  source: HRA

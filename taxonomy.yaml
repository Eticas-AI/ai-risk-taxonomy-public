  broader: security-ai-attacks
  maturity: established
  label: Guardrail evasion
  alt_labels:
  - Evasion attacks
  - Guardrail robustness
  - Adversarial evasion
  definition: Inputs crafted so that a deployed system acts on a request its safeguards should have blocked.
    For LLM deployments, the robustness of the guardrail or filter layer to input transformations that
    keep the request readable to the model while defeating the guardrail; for classifier-based systems,
    adversarial perturbations that force misclassification at inference time. Poisoning of training or
    fine-tuning data is data-poisoning.
  scope: ALL
  lifecycle_stages:
  - post-processing
